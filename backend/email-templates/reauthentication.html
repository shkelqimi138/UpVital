<!-- Supabase Auth → Email Templates → "Reauthentication"
     Recommended subject: Your UpVital verification code
     Variables: {{ .Token }} (the 6-digit code — used), {{ .Email }}
     NOTE: this template sends a numeric code, NOT a link. -->
<div style="margin:0;padding:0;background:#f5f5f5;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#1a1a1a;">
  <div style="max-width:520px;margin:0 auto;padding:32px 24px;">
    <div style="font-size:20px;font-weight:700;color:#16A34A;margin-bottom:24px;">UpVital</div>
    <div style="background:#ffffff;border-radius:12px;padding:28px 24px;">
      <p style="margin:0 0 16px;font-size:18px;font-weight:600;">Verification code</p>
      <p style="margin:0 0 20px;font-size:15px;line-height:22px;">
        Enter this code in UpVital to confirm it's you:
      </p>
      <p style="margin:0 0 20px;font-size:30px;font-weight:700;letter-spacing:6px;color:#16A34A;text-align:center;">
        {{ .Token }}
      </p>
      <p style="margin:0;font-size:13px;color:#666;text-align:center;">This code expires shortly. Don't share it with anyone.</p>
    </div>
    <p style="margin:20px 0 0;font-size:12px;color:#999;text-align:center;">
      If you didn't request this, you can safely ignore this email.
    </p>
  </div>
</div>
